name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev python -m pytest -q
      - run: uv run --locked --extra dev ruff check stock_crawler tests --select F,E9
      - run: node --check stock_crawler/static/app.js
      - run: uv run --locked --extra dev python -m stock_crawler report --demo --output reports/sample.pdf
